name: NICEDT reproducibility tests
on:
  push:
    paths:
      - "research/nicedt2027-operating-point-analysis/**"
      - ".github/workflows/nicedt-repro.yml"
  pull_request:
    paths:
      - "research/nicedt2027-operating-point-analysis/**"
      - ".github/workflows/nicedt-repro.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install -r research/nicedt2027-operating-point-analysis/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s research/nicedt2027-operating-point-analysis/tests -v
